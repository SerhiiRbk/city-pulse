<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <!-- City skyline silhouette -->
  <g fill="currentColor" opacity="0.18">
    <!-- Building 1 - left narrow -->
    <rect x="8" y="22" width="10" height="30" rx="1"/>
    <!-- Building 2 - medium -->
    <rect x="20" y="14" width="14" height="38" rx="1"/>
    <!-- Building 3 - tall tower -->
    <rect x="36" y="6" width="12" height="46" rx="1"/>
    <!-- Antenna on tall tower -->
    <rect x="41" y="1" width="2" height="6"/>
    <!-- Building 4 - short wide -->
    <rect x="50" y="26" width="16" height="26" rx="1"/>
    <!-- Building 5 - medium tall -->
    <rect x="68" y="16" width="12" height="36" rx="1"/>
    <!-- Building 6 - short -->
    <rect x="82" y="30" width="10" height="22" rx="1"/>
  </g>

  <!-- Pulse line  the heartbeat of the city -->
  <polyline
    points="0,38 16,38 24,38 32,38 38,38 44,22 48,48 52,14 56,42 62,38 72,38 84,38 96,38"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Text: City-Pulse -->
  <text x="104" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="currentColor" letter-spacing="-0.5">
    City<tspan fill="currentColor" opacity="0.5">-</tspan>Pulse
  </text>
</svg>
